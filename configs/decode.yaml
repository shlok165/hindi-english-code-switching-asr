# Initial values only. src.tune_lm sets the real ones from validation data, and
# they must be frozen here before any test or blind decoding.
decoder:
  kenlm_model: data/language_model/train_5gram.klm
  beam_width: 100
  alpha: 0.5               # LM weight. GUESSED starting point, not tuned
  beta: 1.0                # Word insertion score. GUESSED starting point, not tuned
  unk_score_offset: -10.0  # pyctcdecode default
  beam_prune_logp: -10.0   # pyctcdecode default
  token_min_logp: -5.0     # pyctcdecode default
