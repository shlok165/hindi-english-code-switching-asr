# Tuned on validation data by src.tune_lm, with test and blind untouched.
# WER on the tuning utterances of val: 19.702. Every grid result is in results/lm_tuning.csv.
decoder:
  kenlm_model: data/language_model/train_5gram.klm
  beam_width: 500
  alpha: 0.35               # LM weight
  beta: 1.0                # Word insertion score
  unk_score_offset: -5.0  # Penalty for words outside the LM vocabulary
  beam_prune_logp: -10.0   # pyctcdecode default
  token_min_logp: -5.0     # pyctcdecode default
