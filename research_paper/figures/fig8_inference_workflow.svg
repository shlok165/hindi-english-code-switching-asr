   <g id="text_1">
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle; fill: #0b0b0b" x="122.04" y="18.355359" transform="rotate(-0 122.04 18.355359)">Input: audio file (any common format) or manifest (CSV/JSONL)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle; fill: #0b0b0b" x="122.04" y="45.193359" transform="rotate(-0 122.04 45.193359)">Artifact checks: checkpoint, vocabulary, decoder config, LM</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(51.406078 72.415022)">Audio validation: missing, empty, corrupt, non-finite,</text>
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(64.940203 79.315696)">silent, shorter than 0.1 s or longer than 60 s</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle; fill: #0b0b0b" x="122.04" y="106.543547" transform="rotate(-0 122.04 106.543547)">Transcriber: load iteration 4 once (CPU or CUDA)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.5px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(37.140328 141.455371)">Greedy CTC decoding</text>
    <text style="font-size: 6.5px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(39.67025 148.251489)">(no language model)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(144.277102 138.218563)">Beam search, 5-gram LM:</text>
    <text style="font-size: 6.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(138.353625 144.80557)">KenLM binary, or pure-Python</text>
    <text style="font-size: 6.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(141.847172 152.028976)">ARPA reader without kenlm</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(56.777859 182.323022)">Output: text, JSON lines (text, timing, warnings),</text>
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(87.123938 189.885759)">or the Streamlit dashboard</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(60.054656 220.663022)">Optional scoring (src.score_files): WER, CER,</text>
    <text style="font-size: 6.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #0b0b0b" transform="translate(68.704781 227.569884)">T-WER, script-folded WER, error tables</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 6.1px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle; fill: #52514e" x="122.04" y="249.553592" transform="rotate(-0 122.04 249.553592)">Application layer added after the experiments; it does not change the reported metrics.</text>
